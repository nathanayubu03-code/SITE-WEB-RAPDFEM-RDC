# Publie la version de démonstration (pages fixes) sur GitHub Pages :
# https://nathanayubu03-code.github.io/SITE-WEB-RAPDFEM-RDC/
#
# À activer une seule fois : Settings > Pages > Build and deployment >
# Source : « GitHub Actions ».

name: Démo GitHub Pages

on:
  push:
    branches: [main, claude/happy-turing-xj1sn0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd, mbstring, fileinfo
          coverage: none

      - name: Générer les pages
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          php bin/export-static.php _site "/$REPO" "https://${GITHUB_REPOSITORY_OWNER}.github.io/$REPO"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
