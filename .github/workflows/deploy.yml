# Déploiement automatique par FTP vers l'hébergeur (InfinityFree, cPanel...).
# Se lance à chaque push sur la branche principale, ou à la main depuis
# l'onglet Actions > « Déployer le site » > « Run workflow ».
#
# Secrets à créer dans GitHub > Settings > Secrets and variables > Actions :
#   FTP_SERVER    ex. ftpupload.net (InfinityFree) ou ftp.votre-domaine.org
#   FTP_USERNAME  identifiant FTP du panneau de l'hébergeur
#   FTP_PASSWORD  mot de passe FTP
# Variables (onglet « Variables ») :
#   FTP_ENABLED     mettre « true » pour activer le déploiement
#   FTP_SERVER_DIR  dossier de destination, par défaut htdocs/ (cPanel : public_html/)
#
# Les photos, PDF, la base de données et app/config.php ne sont jamais
# dans le dépôt : un déploiement ne les écrase donc pas.

name: Déployer le site

on:
  push:
    branches: [main, claude/happy-turing-xj1sn0]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Ne tourne que si l'hébergement est configuré (évite un échec à chaque push).
    if: vars.FTP_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la syntaxe PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Envoyer les fichiers par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || 'htdocs/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            docs/**
            README.md
